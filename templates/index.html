<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Water Potability Predection</title>
    <link rel="stylesheet" href="{{ url_for('static',filename='style.css' ) }}">
</head>

<body>
    <div class="container">
        <h1>Water Potability Predection</h1>
        <form method="post">
                <div class="cont">
                    <div class="input-group">
                        <label for="name">ph Value</label>
                        <input type="text" name="ph" id="ph" />
                    </div>
                    <div class="input-group">
                        <label for="email">Hardness</label>
                        <input class="form-control" id="Hardness" name="Hardness" />
                    </div>
                    <div class="input-group">
                        <label for="phone">Solids</label>
                        <input type="text" class="form-control" id="Solids" name="Solids" />
                    </div>
                </div>
                <div class="cont">

                    <div class="input-group">
                        <label for="name">Chloramines</label>
                        <input type="text" name="Chloramines" id="Chloramines" />
                    </div>
                    <div class="input-group">
                        <label for="email">Sulfate</label>
                        <input class="form-control" id="Sulfate" name="Sulfate" />
                    </div>
                    <div class="input-group">
                        <label for="phone">Conductivity:</label>
                        <input type="text" class="form-control" id="Conductivity" name="Conductivity" />
                    </div>
                </div>
 
                <div class="cont">

                    <div class="input-group">
                        <label for="name">Organic carbon</label>
                        <input type="text" name="Organic_carbon" id="Organic_carbon" />
                    </div>
                    <div class="input-group">
                        <label for="email">Trihalomethanes</label>
                        <input class="form-control" id="Trihalomethanes" name="Trihalomethanes" />
                    </div>
                    <div class="input-group">
                        <label for="phone">Turbidity</label>
                        <input type="text" class="form-control" id="Turbidity" name="Turbidity" />
                    </div>
                </div>

            <div class="box">
                <div class="box1">
                    <button type="submit" formaction="/predict" value="Predict">Predict</button>
                    <button type="submit" formaction="/reset" value="reset">Reset</button>
                </div>
                <div class="box2">
                    {% if message %}

                    <h2 style="color: red;"> {{message}}</h2>
                    {% else %}
                    <h2>Prediction : {{result}}</h2>

                    {% endif %}

                </div>
            </div>
        </form>



    </div>

</body>

</html>
